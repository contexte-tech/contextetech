<!doctype html>

<tr><td style="padding:22px 28px;border-bottom:1px solid #E9EDF1">

$body
</td></tr>
<tr><td style="padding:18px 28px;border-top:1px solid #E9EDF1;font-size:12px;line-height:1.5;color:#5B6773">
$footer<br>
<a href="$origin" style="color:#0B7285">$domain</a> · <a href="$origin/legal/mentions" style="color:#5B6773">$legal</a>

</html>
